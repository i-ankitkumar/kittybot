[project]
name = "kittybot"
version = "0.1.0"
description = "Split household expenses from Telegram. Pull grocery orders from Instamart, Zepto, Blinkit and BigBasket, approve every split, write it to Kittysplit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ankit Kumar" }]
keywords = ["expenses", "split", "telegram", "kittysplit", "groceries", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kittybot = "kittybot.cli:main"

[project.urls]
Homepage = "https://github.com/i-ankitkumar/kittybot"
Repository = "https://github.com/i-ankitkumar/kittybot"
Issues = "https://github.com/i-ankitkumar/kittybot/issues"
HomepageSite = "https://iankitkumar.in/tools/kittybot/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kittybot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
